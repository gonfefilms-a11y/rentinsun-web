<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent In Sun | Alquiler en Almuñécar y Costa Tropical</title>
<meta name="description" content="Rent In Sun ofrece alquiler profesional en Almuñécar desde 2003. Apartamentos, casas y villas en la Costa Tropical: vacacional, temporal y anual.">
<link rel="icon" href="https://horizons-cdn.hostinger.com/97d13a20-34da-40d3-9ad6-c650fbb07c43/67b206b128d1c32ee7f8a1b094c20ad5.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1113;--bg2:#0f191c;--surface:#131f23;--surface2:#18282c;--line:rgba(243,236,226,.09);--line2:rgba(243,236,226,.16);
  --text:#f3ece2;--muted:#a3afac;--faint:#6f7d7a;
  --sun:#e8b46c;--sun2:#f3cc93;--sea:#6cc0bb;--coral:#e2775b;--ok:#7fcf9a;
  --r:18px;--r-sm:10px;--shadow:0 30px 60px -30px rgba(0,0,0,.7);
  --serif:"Fraunces",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
  --max:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::selection{background:var(--sun);color:#1a1209}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
@media(min-width:720px){.wrap{padding:0 32px}}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--sun);font-weight:600}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.08}
h2.sec{font-size:clamp(32px,4.6vw,54px)}
h2.sec em,h1 em{font-style:italic;color:var(--sun2)}
.lead{color:var(--muted);font-size:17px;max-width:620px}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;transition:.25s;white-space:nowrap}
.btn-sun{background:var(--sun);color:#1b130a}.btn-sun:hover{background:var(--sun2);transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line2);color:var(--text)}.btn-ghost:hover{border-color:var(--sun);color:var(--sun2)}
.btn-wa{background:#25d366;color:#06240f}.btn-wa:hover{filter:brightness(1.08)}
.btn-sm{height:38px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
section{position:relative}
.pad{padding:96px 0}@media(max-width:720px){.pad{padding:68px 0}}

/* header */
.hdr{position:fixed;inset:0 0 auto 0;z-index:50;transition:.35s;border-bottom:1px solid transparent}
.hdr.solid{background:rgba(10,17,19,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:50%;background:var(--text);display:grid;place-items:center;overflow:hidden;flex:none}
.brand-mark img{width:34px;height:34px;object-fit:contain}
.brand-name{font-family:var(--serif);font-size:22px;line-height:1}
.brand-name small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:flex;gap:4px;align-items:center}
.nav a{padding:8px 14px;border-radius:999px;font-size:14.5px;color:var(--muted);transition:.2s;font-weight:500}
.nav a:hover,.nav a.on{color:var(--text);background:rgba(243,236,226,.06)}
.hdr-cta{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);transition:.2s;position:relative}
.icon-btn:hover{border-color:var(--sun);color:var(--sun2)}
.icon-btn .dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--sun);color:#1b130a;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.burger{display:none}
@media(max-width:1020px){.nav,.hdr-cta .hide-m{display:none}.burger{display:grid}}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(5,9,10,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s,visibility .3s;overflow:hidden;visibility:hidden}
.drawer.open{opacity:1;pointer-events:auto;visibility:visible}
.drawer-panel{position:absolute;right:0;top:0;bottom:0;width:min(360px,88vw);background:var(--bg2);border-left:1px solid var(--line);padding:24px;transform:translateX(100%);transition:.35s;display:flex;flex-direction:column;gap:6px}
.drawer.open .drawer-panel{transform:none}
.drawer-panel a.dl{font-family:var(--serif);font-size:28px;padding:8px 0;border-bottom:1px solid var(--line)}

/* hero */
.hero{min-height:100svh;display:flex;align-items:flex-end;padding:140px 0 56px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:kb 22s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.hero-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,17,19,.55) 0%,rgba(10,17,19,.1) 35%,rgba(10,17,19,.55) 70%,var(--bg) 100%)}
.hero>.wrap{width:100%}
.hero h1{font-size:clamp(40px,6.2vw,92px);max-width:16ch;text-shadow:0 2px 40px rgba(0,0,0,.35)}
.hero p.lead{color:#e4dfd6;margin-top:22px;font-size:18px}
.search{margin-top:40px;background:rgba(15,25,28,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:22px;padding:10px;display:grid;grid-template-columns:1.2fr 1fr 1fr .9fr auto;gap:6px;max-width:980px}
.search .f{padding:10px 16px;border-radius:14px;transition:.2s}
.search .f:hover{background:rgba(243,236,226,.05)}
.search label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.search input,.search select{background:none;border:0;outline:0;width:100%;font-size:15.5px;padding-top:2px;color-scheme:dark}
.search select option{background:var(--bg2)}
.search .btn{height:auto;border-radius:14px;padding:0 28px}
@media(max-width:860px){.search{grid-template-columns:1fr 1fr}.search .f:first-child{grid-column:1/-1}.search .btn{grid-column:1/-1;height:52px}}
.hero-meta{display:flex;gap:36px;margin-top:40px;flex-wrap:wrap}
.hero-meta div{border-left:1px solid var(--line2);padding-left:16px}
.hero-meta b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1}
.hero-meta span{font-size:13px;color:var(--muted)}

/* services */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:48px}
.svc>div{background:var(--bg);padding:32px 28px;transition:.3s}
.svc>div:hover{background:var(--surface)}
.svc .n{font-family:var(--serif);font-style:italic;color:var(--sun);font-size:15px}
.svc h3{font-size:24px;margin:18px 0 10px}
.svc p{color:var(--muted);font-size:15px}
@media(max-width:900px){.svc{grid-template-columns:1fr 1fr}}@media(max-width:560px){.svc{grid-template-columns:1fr}}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.sec-head .lead{margin-top:14px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px 22px;margin-top:40px}
.card{position:relative}
.card-media{position:relative;display:block;aspect-ratio:4/3.2;border-radius:var(--r);overflow:hidden;background:var(--surface)}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .3s}
.card:hover .card-media img{transform:scale(1.04)}
.card-media:after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(10,17,19,.72);backdrop-filter:blur(8px);border:1px solid var(--line2)}
.badge.alquilado{background:rgba(226,119,91,.92);color:#fff;border-color:transparent}
.badge.reservado{background:rgba(232,180,108,.95);color:#1b130a;border-color:transparent}
.badge.disponible{color:var(--ok)}
.fav{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(10,17,19,.55);backdrop-filter:blur(8px);transition:.2s}
.fav:hover{transform:scale(1.08)}
.fav.on svg{fill:var(--coral);stroke:var(--coral)}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(243,236,226,.9);color:#111;display:grid;place-items:center;opacity:0;transition:.2s}
.card:hover .car-btn{opacity:1}
@media(hover:none){.car-btn{opacity:.85}}
.car-btn.prev{left:10px}.car-btn.next{right:10px}
.car-count{position:absolute;bottom:12px;right:12px;z-index:2;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(10,17,19,.65)}
.card-body{padding:14px 2px 0}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.rating{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:600}
.rating svg{fill:var(--sun);stroke:var(--sun);width:14px;height:14px}
.card h3{font-size:22px;margin:6px 0 8px}
.specs{display:flex;gap:14px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.specs span{display:inline-flex;align-items:center;gap:6px}
.specs .ico{width:15px;height:15px}
.avail{font-size:13.5px;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin-top:10px;font-weight:600;color:var(--sun2)}

/* recos / zones */
.reco{display:grid;grid-template-columns:1.15fr 1fr;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-top:44px;background:var(--surface)}
.reco img{width:100%;height:100%;object-fit:cover;min-height:360px}
.reco .txt{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.reco h3{font-size:40px}
@media(max-width:820px){.reco{grid-template-columns:1fr}.reco .txt{padding:32px 24px}}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:44px}
.zone{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/11;display:block}
.zone img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.zone:hover img{transform:scale(1.05)}
.zone:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,9,10,.85))}
.zone .zt{position:absolute;left:28px;bottom:24px;right:28px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end}
.zone h3{font-size:clamp(30px,4vw,46px)}
.zone .cnt{font-size:14px;color:#e4dfd6}
@media(max-width:700px){.zones{grid-template-columns:1fr}}

/* testimonials */
.tst{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.tst blockquote{border:1px solid var(--line);border-radius:var(--r);padding:32px;background:linear-gradient(180deg,var(--surface),var(--bg));display:flex;flex-direction:column;gap:24px}
.tst p{font-family:var(--serif);font-size:20px;line-height:1.45;font-weight:300}
.who{display:flex;align-items:center;gap:12px;margin-top:auto}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;color:var(--sun2);font-size:14px}
.who small{display:block;color:var(--muted);font-size:13px}
.stars{display:flex;gap:3px}.stars svg{width:15px;height:15px;fill:var(--sun);stroke:var(--sun)}
@media(max-width:900px){.tst{grid-template-columns:1fr}}

.cta{border-radius:28px;overflow:hidden;position:relative;padding:88px 40px;text-align:center}
.cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.cta:after{content:"";position:absolute;inset:0;background:rgba(8,14,16,.62);z-index:-1}
.cta h2{font-size:clamp(34px,5vw,62px)}
.cta .btns{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap}

/* footer */
footer{border-top:1px solid var(--line);margin-top:40px;padding:64px 0 32px;background:var(--bg2)}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.3fr;gap:40px}
.fgrid h4{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sun);margin-bottom:16px;font-family:var(--sans);font-weight:700}
.fgrid a,.fgrid li{display:block;color:var(--muted);font-size:14.5px;padding:4px 0;list-style:none}
.fgrid a:hover{color:var(--text)}
.fgrid p{color:var(--muted);font-size:14.5px;margin-top:16px;max-width:340px}
.fbot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:48px;padding-top:24px;font-size:13px;color:var(--faint)}
@media(max-width:860px){.fgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fgrid{grid-template-columns:1fr}}

/* page head */
.phead{padding:140px 0 36px}
.phead h1{font-size:clamp(40px,6vw,76px)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap}.crumbs a:hover{color:var(--sun2)}

/* filters */
.fbar{position:sticky;top:76px;z-index:20;background:rgba(10,17,19,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-block:1px solid var(--line);padding:12px 0}
.fbar .wrap{display:flex;gap:10px;align-items:center;overflow-x:auto;scrollbar-width:none}
.fbar .wrap::-webkit-scrollbar{display:none}
.fin{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);flex:none}
.fin input,.fin select{background:none;border:0;outline:0;font-size:14px;color-scheme:dark}
.fin select option{background:var(--bg2)}
.fin input{width:170px}
.chip{height:42px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;font-size:14px;display:inline-flex;align-items:center;gap:8px;flex:none;transition:.2s;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip.on{background:var(--sun);color:#1b130a;border-color:var(--sun);font-weight:600}
.results{display:flex;justify-content:space-between;align-items:center;margin-top:28px;color:var(--muted);font-size:14px;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:80px 20px;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);margin-top:40px}

/* detail */
.dhead{padding:120px 0 24px}
.dhead h1{font-size:clamp(34px,5vw,62px);max-width:20ch}
.dmeta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14.5px;margin-top:14px}
.dmeta .sep{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.dactions{display:flex;gap:8px}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:240px 240px;gap:8px;border-radius:var(--r);overflow:hidden;position:relative}
.gal button{position:relative;overflow:hidden;background:var(--surface)}
.gal button img{width:100%;height:100%;object-fit:cover;transition:transform .7s,filter .3s}
.gal button:hover img{transform:scale(1.04);filter:brightness(1.08)}
.gal button:first-child{grid-row:1/3}
.gal.g1{grid-template-columns:1fr;grid-template-rows:520px}.gal.g2{grid-template-columns:1fr 1fr;grid-template-rows:480px}.gal.g2 button:first-child,.gal.g1 button:first-child{grid-row:auto}.gal.g3{grid-template-columns:2fr 1fr}.gal.g4 button:nth-child(4){grid-column:span 2}
.gal .all{position:absolute;right:16px;bottom:16px;z-index:3}
@media(max-width:760px){.gal{grid-template-columns:1fr 1fr;grid-template-rows:260px 130px}.gal button:first-child{grid-column:1/-1;grid-row:auto}.gal button:not(.all):nth-child(n+4){display:none}.gal.g1,.gal.g2{grid-template-rows:300px}.gal.g4 button:nth-child(4){grid-column:auto}}
.dgrid{display:grid;grid-template-columns:1fr 380px;gap:56px;margin-top:44px;align-items:start}
.dgrid>*{min-width:0}
@media(max-width:980px){.dgrid{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{padding:20px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;line-height:1.1}
.facts span{font-size:13px;color:var(--muted)}
@media(max-width:560px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(2){border-right:0}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.dsec{padding:36px 0;border-bottom:1px solid var(--line)}
.dsec h3{font-size:28px;margin-bottom:16px}
.desc p{color:#d6d0c6;margin-bottom:14px;font-size:16.5px}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.amen div{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14.5px}
.amen svg{color:var(--sun)}
.map{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);height:340px;margin-top:16px;filter:grayscale(.3) invert(.9) hue-rotate(180deg) contrast(.9)}
.map iframe{width:100%;height:100%;border:0}
.book{position:sticky;top:100px;border:1px solid var(--line2);border-radius:22px;padding:26px;background:linear-gradient(180deg,var(--surface2),var(--surface));box-shadow:var(--shadow)}
.book .p{font-family:var(--serif);font-size:30px}
.book .p small{font-family:var(--sans);font-size:14px;color:var(--muted)}
.bfields{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:14px;margin:18px 0 14px;overflow:hidden}
.bfields .f{padding:10px 14px}
.bfields .f+.f{border-left:1px solid var(--line2)}
.bfields .full{grid-column:1/-1;border-top:1px solid var(--line2);border-left:0!important}
.bfields label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bfields input,.bfields select{width:100%;background:none;border:0;outline:0;color-scheme:dark;font-size:15px}
.bfields select option{background:var(--bg2)}
.book .stack{display:grid;gap:10px}
.book .note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.book .availbox{font-size:14px;color:#d6d0c6;background:rgba(243,236,226,.04);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.availbox b{color:var(--sun2);font-weight:600;display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,8,9,.97);display:none;flex-direction:column}
.lb.open{display:flex}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;color:var(--muted);font-size:14px}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 64px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;background:rgba(10,17,19,.6)}
.lb-nav:hover{border-color:var(--sun)}

const isOwnImg=u=>!u||u.startsWith("data:")||(CLOUD&&u.startsWith(CFG.supabaseUrl.replace(/\/$/,"")));
async function reencode(url){
  const r=await fetch(url,{mode:"cors",cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
  const b=await r.blob();const png=b.type==="image/png";
  const bm=await createImageBitmap(b);const m=png?1200:1800,s=Math.min(1,m/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(new Error("canvas")),png?"image/png":"image/jpeg",.84));
}
async function pool(items,n,fn){const out=new Array(items.length);let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;out[k]=await fn(items[k],k)}}));return out}
let MIGRATING=false;
async function migratePhotos(){
  if(MIGRATING)return;MIGRATING=true;
  const box=$("#migProg"),btn=$('[data-act="migrate"]');if(btn)btn.disabled=true;
  const props=PROPS.filter(p=>(p.images||[]).some(u=>!isOwnImg(u)));
  const siteKeys=Object.keys(IMG).filter(k=>!isOwnImg(IMG[k]));
  const total=props.reduce((s,p)=>s+p.images.filter(u=>!isOwnImg(u)).length,0)+siteKeys.length;
  let done=0,fail=0;const failed=[];
  const upd=()=>{if(box)box.innerHTML=`<div class="bar" style="grid-template-columns:1fr 70px"><span class="t"><i style="width:${total?done/total*100:100}%"></i></span><b>${done}/${total}</b></div><p class="small muted">${t("{n} fotos con error",{n:fail})}</p>`};
  upd();
  try{
    for(const p of props){
      const imgs=await pool(p.images,4,async u=>{if(isOwnImg(u))return u;try{const nu=await DB.upload(await reencode(u),"props/"+p.id);return nu}catch(e){fail++;failed.push(u);return u}finally{done++;upd()}});
      p.images=imgs;await DB.saveProp(p);
    }
    const imgs={};
    for(const k of siteKeys){try{imgs[k]=await DB.upload(await reencode(IMG[k]),"web")}catch(e){fail++;failed.push(IMG[k])}finally{done++;upd()}}
    if(Object.keys(imgs).length){Object.assign(IMG,imgs);const cur={};Object.keys(IMG).forEach(k=>{if(isOwnImg(IMG[k]))cur[k]=IMG[k]});await DB.saveSetting("images",cur)}
    toast(fail?t("Migración terminada con {n} errores. Puedes volver a lanzarla para reintentar.",{n:fail}):t("Todas las fotos están ya en tu servidor"));
    if(box&&failed.length)box.innerHTML+=`<details class="small muted" style="margin-top:8px"><summary>${t("Ver fotos con error")}</summary>${failed.map(u=>`<div style="word-break:break-all">${esc(u)}</div>`).join("")}</details>`;
  }catch(e){toast(t("Error: {e}",{e:errMsg(e)}))}
  MIGRATING=false;if(btn)btn.disabled=false;
}

   case "lb":lbOpen(+el.dataset.i);break;
   case "lb-close":lbClose();break;case "lb-prev":lbStep(-1);break;case "lb-next":lbStep(1);break;
   case "lb-go":LB.i=+el.dataset.i;lbShow();break;
   case "share":{const u=location.href;try{if(navigator.share){await navigator.share({title:document.title,url:u})}else{await navigator.clipboard.writeText(u);toast(t("Enlace copiado"))}}catch(err){}break}
   case "scroll-eval":e.preventDefault();$("#eval").scrollIntoView({behavior:"smooth"});break;
   case "am":{const h=hashParts()[1];const cur=(parseQ(h).am||"").split(",").filter(Boolean);const v=el.dataset.am;setQ("am",(cur.includes(v)?cur.filter(x=>x!==v):[...cur,v]).join(","));break}
   case "logout":e.preventDefault();await DB.logout();location.hash="#/admin";route();break;
   case "tg":if(p){const k=el.dataset.k,old=p[k];p[k]=k==="published"?p.published===false:!p[k];el.classList.toggle("on");try{await DB.saveProp(p);toast(t("Actualizado"))}catch(err){p[k]=old;el.classList.toggle("on");toast(t("Error: {e}",{e:errMsg(err)}))}}break;
   case "dup":if(p){const c=JSON.parse(JSON.stringify(p));c.id=null;c.order=null;c.title+=" ("+t("copia")+")";c.published=false;try{await DB.saveProp(c);toast(t("Duplicada como borrador"));route()}catch(err){toast(t("Error: {e}",{e:errMsg(err)}))}}break;
   case "del":if(p&&confirm(t("¿Eliminar «{p}»? Esta acción no se puede deshacer.",{p:p.title}))){try{await DB.delProp(p);toast(t("Propiedad eliminada"));route()}catch(err){toast(t("Error: {e}",{e:errMsg(err)}))}}break;
   case "del-ed":{const q=byId(ED.id);if(q&&confirm(t("¿Eliminar «{p}»? Esta acción no se puede deshacer.",{p:q.title}))){try{await DB.delProp(q);ED=null;location.hash="#/admin/propiedades"}catch(err){toast(t("Error: {e}",{e:errMsg(err)}))}}break}
   case "etg":syncEd();ED[el.dataset.k]=el.dataset.k==="published"?ED.published===false:!ED[el.dataset.k];el.classList.toggle("on");break;
   case "trtab":syncEd();EDTAB=el.dataset.l;$$(".trtabs button").forEach(b=>b.classList.toggle("on",b===el));$$(".trpane").forEach(x=>x.style.display=x.dataset.pane===EDTAB?"":"none");break;
   case "addurl":{const urls=$("#urlIn").value.split(/\s+/).map(s=>s.trim()).filter(s=>/^https?:\/\//.test(s));if(!urls.length){toast(t("Pega una URL válida (https://…)"));break}syncEd();ED.images.push(...urls);rerenderEd();toast(t("{n} imagen(es) añadidas",{n:urls.length}));break}
   case "img-cover":case "img-l":case "img-r":case "img-del":{syncEd();const i=+el.closest(".it").dataset.i;const im=ED.images;if(a==="img-del")im.splice(i,1);else if(a==="img-cover")im.unshift(...im.splice(i,1));else{const j=a==="img-l"?i-1:i+1;if(j<0||j>=im.length)break;[im[i],im[j]]=[im[j],im[i]]}rerenderEd();break}
   case "save":{syncEd();if(!ED.title||!ED.title.trim()){toast(t("El título es obligatorio"));$('[data-k="title"]').focus();break}
     if(el.disabled)break;$$('[data-act="save"]').forEach(b=>b.disabled=true);
     const isNew=ED.id==="new";
     ED.guests=ED.guests||1;ED.bedrooms=ED.bedrooms??0;ED.baths=ED.baths??1;ED.rating=ED.rating??5;ED.reviews=ED.reviews??0;
     const copy=JSON.parse(JSON.stringify(ED));
     try{await DB.saveProp(copy);toast(isNew?t("Propiedad creada y publicada"):t("Cambios guardados"));ED=null;location.hash="#/admin/propiedades"}
     catch(err){toast(t("Error: {e}",{e:errMsg(err)}));$$('[data-act="save"]').forEach(b=>b.disabled=false)}
     break}
   case "ldel":{const l=LEADS.find(x=>String(x.id)===el.closest("tr").dataset.lid);if(l&&confirm(t("¿Eliminar esta solicitud?"))){try{await DB.delLead(l);route()}catch(err){toast(t("Error: {e}",{e:errMsg(err)}))}}break}
   case "csv":{const head=[t("Fecha"),t("Tipo"),t("Nombre"),t("Email"),t("Teléfono"),t("Propiedad"),t("Detalle"),t("Estado"),t("Idioma")];const rows=LEADS.map(l=>[l.date,t(l.type),l.name,l.email,l.phone,l.property,l.detail,t(LEADST[l.status]||l.status),l.lang].map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";"));dl("solicitudes-rentinsun.csv","﻿"+head.join(";")+"\n"+rows.join("\n"),"text/csv");break}
   case "export":dl(`rentinsun-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:2,exported:new Date().toISOString(),properties:PROPS,leads:LEADS,conf:CONF},null,1),"application/json");break;
   case "reset":{const sd=await getSeed();if(confirm(t("Se restaurará el catálogo original de {n} propiedades y se perderán los cambios. ¿Continuar?",{n:sd.length}))){await DB.seedCatalog();toast(t("Catálogo restaurado"));route()}break}
   case "seed":{el.disabled=true;el.textContent=t("Cargando…");try{await DB.seedCatalog();toast(t("Catálogo cargado"));route()}catch(err){el.disabled=false;toast(t("Error: {e}",{e:errMsg(err)}))}break}
   case "migrate":migratePhotos();break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.f){setQ(el.dataset.f,el.value)}
  if(el.dataset.af){AF[el.dataset.af]=el.value;route()}
  if(el.dataset.act==="st"){const p=byId(el.closest("tr").dataset.id);const old=p.status;p.status=el.value;el.className="st-sel "+el.value;DB.saveProp(p).then(()=>toast(t("Estado: {s}",{s:t(STATUS[el.value])}))).catch(err=>{p.status=old;toast(t("Error: {e}",{e:errMsg(err)}));route()})}
  if(el.dataset.act==="lst"){const l=LEADS.find(x=>String(x.id)===el.closest("tr").dataset.lid);if(l)DB.updLead(l,{status:el.value}).then(()=>toast(t("Solicitud actualizada"))).catch(err=>toast(t("Error: {e}",{e:errMsg(err)})))}
});
let qT;document.addEventListener("input",e=>{const el=e.target;if(el.dataset.f==="q"){clearTimeout(qT);qT=setTimeout(()=>{setQ("q",el.value);setTimeout(()=>{const i=$('[data-f="q"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},0)},400)}
  if(el.dataset.af==="q"){clearTimeout(qT);qT=setTimeout(()=>{AF.q=el.value;route();const i=$('[data-af="q"]');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)}});
document.addEventListener("submit",async e=>{
  const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());
  if(k==="search"){const o={};["town","guests","in","out"].forEach(x=>d[x]&&(o[x]=d[x]));location.hash="#/propiedades"+(Object.keys(o).length?"?"+new URLSearchParams(o):"")}
  if(k==="book"){const p=byId(f.dataset.id);const via=e.submitter?.value||"wa";const title=L(p,"title");
    const msg=t("Hola Rent In Sun, me interesa «{p}» ({z}).",{p:title,z:p.zone})+"\n"+t("Entrada")+": "+fmtDate(d.in)+"\n"+t("Salida")+": "+fmtDate(d.out)+"\n"+t("Huéspedes")+": "+d.guests+"\n"+t("¿Podéis confirmarme disponibilidad y precio? Gracias.");
    if(via==="wa")window.open(waLink(msg),"_blank","noopener");else mailto(t("Consulta: {p}",{p:title}),msg);
    DB.addLead({type:_("Consulta de reserva"),name:t("Visitante web ({v})",{v:via==="wa"?"WhatsApp":t("email")}),property:p.title,detail:`${d.in||"?"} → ${d.out||"?"} · ${d.guests} pax`}).catch(()=>{})}
  if(k==="contact"||k==="owner"){
    const btn=f.querySelector('[type=submit]');if(btn.disabled)return;btn.disabled=true;
    const lead=k==="contact"?{type:_("Contacto"),name:d.name,email:d.email,phone:d.phone,detail:t(d.subject)+" · "+d.message}
      :{type:_("Evaluación propietario"),name:d.name,email:d.email,phone:d.phone,detail:`${t(d.ptype)} · ${t(d.rooms)} · ${d.location||"-"} · ${t(d.renting)}${d.message?" · "+d.message:""}`};
    try{await DB.addLead(lead);
      if(!CLOUD){if(k==="contact")mailto(t(d.subject)+" – "+d.name,`${d.message}\n\n${d.name}\n${d.email}\n${d.phone||""}`);else mailto(t("Solicitud de evaluación gratuita")+" – "+d.name,`${t("Nombre")}: ${d.name}\n${t("Email")}: ${d.email}\n${t("Teléfono")}: ${d.phone}\n${t("Tipo de propiedad")}: ${t(d.ptype)}\n${t("Habitaciones")}: ${t(d.rooms)}\n${t("Ubicación")}: ${d.location}\n${t("¿Actualmente alquilas?")} ${t(d.renting)}\n\n${d.message||""}`)}
      f.reset();f.insertAdjacentHTML("beforeend",`<div class="sent">${ic("check")}<div><b>${k==="contact"?t("¡Gracias! Hemos recibido tu mensaje"):t("¡Solicitud enviada! Te contactaremos en menos de 24 h")}</b></div></div>`);
      toast(k==="contact"?t("¡Gracias! Hemos recibido tu mensaje"):t("¡Solicitud enviada! Te contactaremos en menos de 24 h"))}
    catch(err){console.error(err);toast(t("No se pudo enviar. Escríbenos por WhatsApp o llámanos."))}
    btn.disabled=false}
  if(k==="login"){const btn=f.querySelector('[type=submit]');btn.disabled=true;$("#lerr").textContent="";
    try{const r=await DB.login(d.user,d.pass);if(r==="ok")route();else $("#lerr").textContent=r==="noadmin"?t("Esta cuenta no tiene permisos de administración."):t("Usuario o contraseña incorrectos")}
    catch(err){$("#lerr").textContent=t("Error: {e}",{e:errMsg(err)})}
    btn.disabled=false}
  if(k==="conf"){const c=Object.assign({},CONF,{phone:d.phone,wa:d.wa.replace(/\D/g,""),email:d.email,address:d.address,city:d.city});
    try{await DB.saveSetting("contact",c);CONF=c;toast(t("Datos guardados"))}catch(err){toast(t("Error: {e}",{e:errMsg(err)}))}}
  if(k==="pwd"){try{if(d.p1||d.p2){if(d.p1!==d.p2){toast(t("Las contraseñas no coinciden"));return}if(d.p1.length<8){toast(t("Mínimo 8 caracteres"));return}await DB.setPassword(d.p1)}
    if(!CLOUD&&d.user){CONF.user=d.user.trim()||CONF.user;LS.set("ris_conf",CONF)}toast(t("Acceso actualizado"));f.reset();route()}catch(err){toast(t("Error: {e}",{e:errMsg(err)}))}}
});
(async()=>{
  lbBuild();
  $("#app").innerHTML=`<div class="boot"><span class="brand-mark"><img src="${IMG.logo}" alt=""></span><span class="spin"></span></div>`;
  try{await DB.init()}catch(e){console.error(e);BOOT_ERR=e}
  route();
})();
